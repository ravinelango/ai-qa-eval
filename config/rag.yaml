# RAG assistant settings (docs/decisions/0006-rag-corpus-and-index.md).
#
# The chunk manifest records the fingerprints of `corpus`, `chunking` and the
# embedder's tokenizer; the index records the embedding fingerprint. The retriever
# refuses an index built from different inputs, so after editing anything below
# run `make ingest` again.

corpus:
  # Frozen snapshot: ingestion reads only the files listed here and refuses any whose
  # SHA-256 differs. Refreshing from the official sources is explicit:
  # `make corpus-refresh`.
  sources: data/corpus/sources.yaml
  dir: data/corpus

chunking:
  # Bump when a code change alters chunk boundaries, text or IDs.
  version: 1
  manifest: data/index/chunk_manifest.json

embedding:
  name: bge-small-en-v1.5
  repo: BAAI/bge-small-en-v1.5
  # Exact commit of the Hugging Face repo (MIT license; last changed 2024-02-22) and
  # the SHA-256 of each file at that revision. `make model-fetch` installs a file only
  # if its download matches. The real embedder refuses to load files that differ.
  revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  model:
    path: onnx/model.onnx
    # The repo's Git LFS object ID for this file at the revision (an LFS oid is the
    # SHA-256 of the content; 133,093,490 bytes), read 2026-10-12.
    sha256: 828e1496d7fabb79cfa4dcd84fa38625c0d3d21da474a00f08db0f559940cf35
  tokenizer:
    path: tokenizer.json
    # Computed from the download on 2026-10-12 (711,396 bytes).
    sha256: d241a60d5e8f04cc1b2b3e9ef7a4921b27bf526d9f6050ab90f9267a1f9e5c66
  # Model weights are downloaded here and never committed.
  local_dir: .cache/models/bge-small-en-v1.5
  # The model's input limit, counted with special tokens ([CLS], [SEP]). Every text
  # sent to the model, heading context included, must fit; nothing is truncated.
  max_tokens: 512
  dimensions: 384
  pooling: cls
  normalize: true
  # Prepended to queries only, as recommended for bge v1.5 retrieval.
  query_instruction: "Represent this sentence for searching relevant passages: "
  # One thread keeps CPU inference results stable from run to run.
  threads: 1
  batch_size: 16

index:
  # Local Chroma store. Generated by `make ingest`; never committed.
  path: data/chroma
  collection: corpus-chunks
  space: cosine
  ef_construction: 200
  ef_search: 200

retrieval:
  top_k: 5

generation:
  # Provisional generator (README, "Decisions recorded for Phase 1").
  model: sonnet
  max_tokens: 1024
  prompt: apps/rag/prompts/answer-v1.yaml
