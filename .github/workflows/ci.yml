# Ordinary CI: no secrets, no paid calls, no network beyond installing packages.
# The test suite runs with sockets disabled (pytest-socket); live tests are skipped
# because --run-live is never passed here. The paid eval workflow (Phase 1e) is a
# separate file with its own approved budget profile.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install from the committed lockfile
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Unit and offline integration tests
        run: uv run pytest

      - name: Offline demo (fake provider, no keys)
        run: uv run python -m apps.core.demo --out "$RUNNER_TEMP/demo"

      - name: Golden-set evaluator on the synthetic sample (fake provider, no keys)
        run: uv run python -m evals.golden --out "$RUNNER_TEMP/golden"

      - name: Build wheel and check packaged modules
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist"
          uv run python scripts/check_wheel.py "$RUNNER_TEMP"/dist/*.whl
