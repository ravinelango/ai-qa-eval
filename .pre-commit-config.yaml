# Ruff and mypy run from the project environment (uv run), so their versions come
# from uv.lock and match CI exactly.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      # Upstream files are kept byte-identical to their recorded SHA-256.
      - id: end-of-file-fixer
        exclude: &upstream ^(data/models/.*/(tokenizer\.json|LICENSE)|data/corpus/.*\.(xml|pdf))$
      - id: trailing-whitespace
        exclude: *upstream
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=1024"]
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
